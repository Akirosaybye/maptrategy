<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #121212; color: #f5f5f5; min-height: 100vh; }

    /* 1. Pantalla Principal */
    #inicio {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }

    /* 2. Vista de Mapas Guardados */
    #galeria-vista {
      display: none;
      padding: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #333;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2e2e2e;
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .card p {
      padding: 12px;
      font-size: 0.9rem;
      color: #ccc;
    }
    #mensaje-vacio {
      color: #888;
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 0;
    }
  </style>
</head>
<body>

  <!-- 1. Pantalla Principal -->
  <section id="inicio">
    <h1>Mapas</h1>
    <button id="btn-empezar">Empezar</button>
  </section>

  <!-- 2. Vista de Mapas Guardados -->
  <section id="galeria-vista">
    <header>
      <h2>Mapas Guardados</h2>
    </header>
    <div class="grid" id="contenedor-mapas"></div>
  </section>

  <script>
    const btnEmpezar = document.getElementById('btn-empezar');
    const inicio = document.getElementById('inicio');
    const galeriaVista = document.getElementById('galeria-vista');
    const contenedor = document.getElementById('contenedor-mapas');

    btnEmpezar.addEventListener('click', () => {
      inicio.style.display = 'none';
      galeriaVista.style.display = 'block';
      mostrarMapas();
    });

    async function mostrarMapas() {
      contenedor.innerHTML = '';
      let hayMapas = false;

      // 1. Cargar mapas de la carpeta "Mapas" (listados en mapas.json)
      try {
        const res = await fetch('mapas.json');
        const lista = await res.json();
        lista.forEach(ruta => {
          const nombre = ruta.split('/').pop();
          crearTarjeta(nombre, ruta);
          hayMapas = true;
        });
      } catch (e) {
        console.warn('No se encontró mapas.json');
      }

      // 2. Cargar mapas guardados previamente en el navegador
      const guardados = JSON.parse(localStorage.getItem('mis_mapas') || '[]');
      guardados.forEach(mapa => {
        crearTarjeta(mapa.nombre, mapa.src);
        hayMapas = true;
      });

      if (!hayMapas) {
        contenedor.innerHTML = '<p id="mensaje-vacio">No hay mapas disponibles todavía.</p>';
      }
    }

    function crearTarjeta(titulo, src) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${src}" alt="${titulo}" loading="lazy">
        <p>${titulo}</p>
      `;
      contenedor.appendChild(card);
    }
  </script>
</body>
</html>
