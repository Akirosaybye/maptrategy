<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapas y Estrategia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    html, body { background: #050505; color: #f5f5f5; width: 100%; height: 100%; overflow: hidden; }

    /* Pantalla de Inicio */
    #inicio {
      height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 20px;
    }
    button {
      background: #2563eb; color: white; border: none; padding: 14px 36px;
      font-size: 1.1rem; border-radius: 8px; cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }

    /* Galería de Mapas */
    #galeria-vista { display: none; padding: 24px; max-width: 1100px; margin: 0 auto; height: 100vh; overflow-y: auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 16px; border-bottom: 1px solid #333; margin-bottom: 24px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .card {
      background: #1e1e1e; border-radius: 8px; overflow: hidden;
      border: 1px solid #2e2e2e; cursor: pointer; transition: transform 0.1s;
    }
    .card:hover { transform: scale(1.02); border-color: #2563eb; }
    .card img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .card p { padding: 12px; font-size: 0.9rem; color: #ccc; }

    /* Vista del Mapa Interactivo (Fondo 100% gris oscuro) */
    #mapa-vista { display: none; width: 100vw; height: 100vh; position: relative; flex-direction: column; background: #050505; }
    .toolbar-superior {
      background: #1e1e1e; padding: 12px 20px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10;
      flex-shrink: 0;
    }
    .menu-container { position: relative; }
    .menu-desplegable {
      display: none; position: absolute; right: 0; top: 45px;
      background: #1e1e1e; border: 1px solid #333; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 200px; z-index: 100;
    }
    .menu-desplegable button {
      display: block; width: 100%; text-align: left; background: none;
      padding: 12px 16px; border-radius: 0; font-size: 0.95rem; border-bottom: 1px solid #2a2a2a;
    }
    .menu-desplegable button:last-child { border-bottom: none; }
    .menu-desplegable button:hover { background: #2a2a2a; }

    .mapa-container {
      flex: 1; position: relative; overflow: auto; background: #050505;
      display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;
    }
    canvas { background: #050505; cursor: crosshair; display: block; max-width: 100%; max-height: 100%; object-fit: contain; }

    /* Panel flotante de configuraciones */
    .panel-config {
      position: absolute; bottom: 20px; left: 20px; background: rgba(30,30,30,0.95);
      padding: 15px; border-radius: 8px; border: 1px solid #333; z-index: 5;
      font-size: 0.85rem; display: flex; flex-direction: column; gap: 10px;
      backdrop-filter: blur(4px); min-width: 210px; color: #fff;
    }
    .panel-config label { display: flex; justify-content: space-between; gap: 15px; align-items: center; }
    .btn-borrar-todo { background: #dc2626; font-size: 0.85rem; padding: 8px; border-radius: 6px; width: 100%; border: none; color: #fff; cursor: pointer; }
    .btn-borrar-todo:hover { background: #b91c1c; }

    /* Cuadro de diálogo flotante para Notas */
    #modal-nota {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #1e1e1e; border: 1px solid #444; padding: 20px; border-radius: 10px;
      z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 300px;
    }
    #modal-nota h4 { margin-bottom: 10px; font-size: 1rem; color: #fff; }
    #modal-nota textarea {
      width: 100%; height: 90px; background: #111; color: #fff; border: 1px solid #333;
      padding: 8px; border-radius: 6px; resize: none; margin-bottom: 12px; font-family: sans-serif;
    }
    .modal-botones { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-botones button { padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; cursor: pointer; }
    .btn-guardar-nota { background: #2563eb; color: #fff; border: none; }
    .btn-cancelar-nota { background: #333; color: #fff; border: none; }
    .btn-borrar-nota { background: #dc2626; color: #fff; border: none; }
  </style>
</head>
<body>

  <!-- 1. Pantalla Principal -->
  <section id="inicio">
    <h1>Mapas y Estrategia</h1>
    <button id="btn-empezar">Empezar</button>
  </section>

  <!-- 2. Vista de Galería -->
  <section id="galeria-vista">
    <header>
      <h2>Mapas Disponibles</h2>
    </header>
    <div class="grid" id="contenedor-mapas"></div>
  </section>

  <!-- 3. Vista del Mapa Interactivo -->
  <section id="mapa-vista">
    <div class="toolbar-superior">
      <h3 id="titulo-mapa-activo">Mapa</h3>
      <div class="menu-container">
        <button id="btn-menu">Menú ▾</button>
        <div class="menu-desplegable" id="menu-desplegable">
          <button id="opcion-salir">Salir al menú</button>
          <button id="opcion-guardar">Guardar estado</button>
          <button id="opcion-cambiar">Cambiar mapa</button>
        </div>
      </div>
    </div>

    <div class="mapa-container">
      <canvas id="lienzo-mapa"></canvas>
    </div>

    <!-- Panel de control de trazado y notas -->
    <div class="panel-config">
      <strong>Controles</strong>
      <label>Herramienta: 
        <select id="cfg-herramienta" style="background:#222; color:#fff; border:1px solid #444; padding:3px 6px; border-radius:4px;">
          <option value="recta">Flecha Recta</option>
          <option value="seguir">Flecha Seguir</option>
          <option value="nota">Notas (Puntos)</option>
        </select>
      </label>
      <label>Color: <input type="color" id="cfg-color" value="#ef4444" style="background:none; border:none; width:30px; height:25px; cursor:pointer;"></label>
      <label>Tamaño Línea: 
        <select id="cfg-grosor" style="background:#222; color:#fff; border:1px solid #444; padding:3px 6px; border-radius:4px;">
          <option value="4">Fino</option>
          <option value="6" selected>Normal</option>
          <option value="10">Grueso</option>
        </select>
      </label>
      <label>Mostrar: <input type="checkbox" id="cfg-mostrar" checked></label>
      <button class="btn-borrar-todo" id="btn-borrar-todo">Borrar Todo</button>
    </div>
  </section>

  <!-- Modal para editar notas -->
  <div id="modal-nota">
    <h4>Editar Nota</h4>
    <textarea id="texto-nota" placeholder="Escribe tu nota aquí..."></textarea>
    <div class="modal-botones">
      <button class="btn-borrar-nota" id="btn-eliminar-nota">Borrar</button>
      <button class="btn-cancelar-nota" id="btn-cancelar-nota">Cancelar</button>
      <button class="btn-guardar-nota" id="btn-guardar-nota">Guardar</button>
    </div>
  </div>

  <script>
    const inicio = document.getElementById('inicio');
    const galeriaVista = document.getElementById('galeria-vista');
    const mapaVista = document.getElementById('mapa-vista');
    const contenedor = document.getElementById('contenedor-mapas');
    
    const btnMenu = document.getElementById('btn-menu');
    const menuDesplegable = document.getElementById('menu-desplegable');
    const tituloMapaActivo = document.getElementById('titulo-mapa-activo');
    
    const lienzo = document.getElementById('lienzo-mapa');
    const ctx = lienzo.getContext('2d');

    const modalNota = document.getElementById('modal-nota');
    const inputTextoNota = document.getElementById('texto-nota');

    let mapaActual = { nombre: '', src: '' };
    let imagenActual = null;
    let listaFlechas = [];
    let listaNotas = [];
    let dibujando = false;
    let trazoActual = [];
    let notaSeleccionada = null;
    let mouseX = 0, mouseY = 0;

    // Iniciar
    document.getElementById('btn-empezar').addEventListener('click', () => {
      inicio.style.display = 'none';
      galeriaVista.style.display = 'block';
      cargarGaleria();
    });

    // Menú desplegable
    btnMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      menuDesplegable.style.display = menuDesplegable.style.display === 'block' ? 'none' : 'block';
    });
    window.addEventListener('click', () => {
      menuDesplegable.style.display = 'none';
    });

    // Opciones del Menú
    document.getElementById('opcion-salir').addEventListener('click', () => {
      mapaVista.style.display = 'none';
      inicio.style.display = 'flex';
    });

    document.getElementById('opcion-cambiar').addEventListener('click', () => {
      mapaVista.style.display = 'none';
      galeriaVista.style.display = 'block';
    });

    document.getElementById('opcion-guardar').addEventListener('click', () => {
      guardarEstadoEnNavegador();
      const enlace = document.createElement('a');
      const nombreLimpio = mapaActual.nombre.replace(/\.[^/.]+$/, '');
      enlace.download = `estrategia_${nombreLimpio}.png`;
      enlace.href = lienzo.toDataURL('image/png');
      enlace.click();
    });

    document.getElementById('btn-borrar-todo').addEventListener('click', () => {
      if (!confirm('¿Seguro que deseas borrar todas las flechas y notas de este mapa?')) return;
      listaFlechas = [];
      listaNotas = [];
      redibujarEscena();
      guardarEstadoEnNavegador();
    });

    function guardarEstadoEnNavegador() {
      const estado = {
        nombre: mapaActual.nombre,
        dataUrl: lienzo.toDataURL('image/png'),
        flechas: listaFlechas,
        notas: listaNotas
      };
      localStorage.setItem('estado_' + mapaActual.nombre, JSON.stringify(estado));
    }

    // Cargar galería de mapas
    async function cargarGaleria() {
      contenedor.innerHTML = '';
      try {
        const res = await fetch('mapas.json');
        const lista = await res.json();
        lista.forEach(ruta => {
          const nombre = ruta.split('/').pop();
          crearTarjeta(nombre, ruta);
        });
      } catch (e) {
        contenedor.innerHTML = '<p style="color:#888; text-align:center; grid-column:1/-1;">No se encontró mapas.json</p>';
      }
    }

    function crearTarjeta(titulo, src) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${src}" alt="${titulo}" loading="lazy">
        <p>${titulo}</p>
      `;
      card.addEventListener('click', () => abrirMapa(titulo, src));
      contenedor.appendChild(card);
    }

    // Abrir visor y ajustar dimensiones reales
    function abrirMapa(nombre, src) {
      mapaActual = { nombre, src };
      galeriaVista.style.display = 'none';
      mapaVista.style.display = 'flex';
      tituloMapaActivo.textContent = nombre;

      const guardado = localStorage.getItem('estado_' + nombre);

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        imagenActual = img;
        lienzo.width = img.naturalWidth || img.width;
        lienzo.height = img.naturalHeight || img.height;
        ctx.clearRect(0, 0, lienzo.width, lienzo.height);

        if (guardado) {
          const estado = JSON.parse(guardado);
          listaFlechas = estado.flechas || [];
          listaNotas = estado.notas || [];
          redibujarEscena();
        } else {
          listaFlechas = [];
          listaNotas = [];
          ctx.drawImage(img, 0, 0);
        }
      };
      img.src = src;
    }

    // Coordenadas proporcionales al canvas real
    function obtenerPos(e) {
      const rect = lienzo.getBoundingClientRect();
      const sx = lienzo.width / rect.width;
      const sy = lienzo.height / rect.height;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
    }

    function iniciarDibujo(e) {
      const herramienta = document.getElementById('cfg-herramienta').value;
      const pos = obtenerPos(e);

      if (herramienta === 'nota') {
        const notaCercana = listaNotas.find(n => Math.hypot(n.x - pos.x, n.y - pos.y) < 25);
        if (notaCercana) {
          abrirModalNota(notaCercana);
        } else {
          const nuevaNota = { id: Date.now(), x: pos.x, y: pos.y, texto: '' };
          listaNotas.push(nuevaNota);
          abrirModalNota(nuevaNota);
        }
        redibujarEscena();
        return;
      }

      dibujando = true;
      trazoActual = [pos];
    }

    function moverDibujo(e) {
      const herramienta = document.getElementById('cfg-herramienta').value;
      const pos = obtenerPos(e);
      mouseX = pos.x;
      mouseY = pos.y;

      if (!dibujando || herramienta === 'nota') return;
      if (e.cancelable) e.preventDefault();
      
      trazoActual.push(pos);
      redibujarEscena();

      const color = document.getElementById('cfg-color').value;
      const grosor = parseInt(document.getElementById('cfg-grosor').value);
      const mostrar = document.getElementById('cfg-mostrar').checked;

      if (!mostrar) return;

      if (herramienta === 'recta' && trazoActual.length >= 2) {
        const inicio = trazoActual[0];
        const actual = trazoActual[trazoActual.length - 1];
        dibujarFlechaRecta(ctx, inicio.x, inicio.y, actual.x, actual.y, color, grosor);
      } else if (herramienta === 'seguir' && trazoActual.length >= 2) {
        dibujarFlechaSeguir(ctx, trazoActual, color, grosor);
      }
    }

    function terminarDibujo() {
      const herramienta = document.getElementById('cfg-herramienta').value;
      if (!dibujando || herramienta === 'nota') return;
      
      dibujando = false;
      if (trazoActual.length >= 2) {
        const color = document.getElementById('cfg-color').value;
        const grosor = parseInt(document.getElementById('cfg-grosor').value);
        listaFlechas.push({ modo: herramienta, puntos: [...trazoActual], color, grosor });
      }
      trazoActual = [];
      redibujarEscena();
      guardarEstadoEnNavegador();
    }

    lienzo.addEventListener('mousedown', iniciarDibujo);
    lienzo.addEventListener('mousemove', moverDibujo);
    window.addEventListener('mouseup', terminarDibujo);

    lienzo.addEventListener('touchstart', iniciarDibujo, { passive: false });
    lienzo.addEventListener('touchmove', moverDibujo, { passive: false });
    window.addEventListener('touchend', terminarDibujo);

    // Tecla 'E' para abrir la nota bajo el cursor
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'e' && document.getElementById('cfg-herramienta').value === 'nota') {
        const notaCercana = listaNotas.find(n => Math.hypot(n.x - mouseX, n.y - mouseY) < 35);
        if (notaCercana) {
          abrirModalNota(notaCercana);
        }
      }
    });

    function abrirModalNota(nota) {
      notaSeleccionada = nota;
      inputTextoNota.value = nota.texto;
      modalNota.style.display = 'block';
      inputTextoNota.focus();
    }

    document.getElementById('btn-guardar-nota').addEventListener('click', () => {
      if (notaSeleccionada) {
        notaSeleccionada.texto = inputTextoNota.value;
      }
      modalNota.style.display = 'none';
      redibujarEscena();
      guardarEstadoEnNavegador();
    });

    document.getElementById('btn-cancelar-nota').addEventListener('click', () => {
      if (notaSeleccionada && !notaSeleccionada.texto.trim()) {
        listaNotas = listaNotas.filter(n => n.id !== notaSeleccionada.id);
      }
      modalNota.style.display = 'none';
      redibujarEscena();
    });

    document.getElementById('btn-eliminar-nota').addEventListener('click', () => {
      if (notaSeleccionada) {
        listaNotas = listaNotas.filter(n => n.id !== notaSeleccionada.id);
      }
      modalNota.style.display = 'none';
      redibujarEscena();
      guardarEstadoEnNavegador();
    });

    document.getElementById('cfg-mostrar').addEventListener('change', redibujarEscena);

    // Funciones de renderizado
    function dibujarFlechaRecta(c, x1, y1, x2, y2, color, grosor) {
      const headlen = grosor * 4 + 10;
      const angle = Math.atan2(y2 - y1, x2 - x1);

      c.strokeStyle = color;
      c.fillStyle = color;
      c.lineWidth = grosor;
      c.lineCap = 'butt';

      const lineaFinX = x2 - (headlen * 0.7) * Math.cos(angle);
      const lineaFinY = y2 - (headlen * 0.7) * Math.sin(angle);

      c.beginPath();
      c.moveTo(x1, y1);
      c.lineTo(lineaFinX, lineaFinY);
      c.stroke();

      c.beginPath();
      c.moveTo(x2, y2);
      c.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 7), y2 - headlen * Math.sin(angle - Math.PI / 7));
      c.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 7), y2 - headlen * Math.sin(angle + Math.PI / 7));
      c.closePath();
      c.fill();
    }

    function dibujarFlechaSeguir(c, puntos, color, grosor) {
      if (puntos.length < 2) return;
      const headlen = grosor * 4 + 10;
      const pUlt = puntos[puntos.length - 1];

      let idxRef = puntos.length - 2;
      while (idxRef > 0 && Math.hypot(pUlt.x - puntos[idxRef].x, pUlt.y - puntos[idxRef].y) < 18) {
        idxRef--;
      }
      const pRef = puntos[idxRef];
      const angle = Math.atan2(pUlt.y - pRef.y, pUlt.x - pRef.x);

      c.strokeStyle = color;
      c.fillStyle = color;
      c.lineWidth = grosor;
      c.lineCap = 'butt';
      c.lineJoin = 'round';

      c.beginPath();
      c.moveTo(puntos[0].x, puntos[0].y);
      for (let i = 1; i <= idxRef; i++) {
        c.lineTo(puntos[i].x, puntos[i].y);
      }
      const lineaFinX = pUlt.x - (headlen * 0.7) * Math.cos(angle);
      const lineaFinY = pUlt.y - (headlen * 0.7) * Math.sin(angle);
      c.lineTo(lineaFinX, lineaFinY);
      c.stroke();

      c.beginPath();
      c.moveTo(pUlt.x, pUlt.y);
      c.lineTo(pUlt.x - headlen * Math.cos(angle - Math.PI / 7), pUlt.y - headlen * Math.sin(angle - Math.PI / 7));
      c.lineTo(pUlt.x - headlen * Math.cos(angle + Math.PI / 7), pUlt.y - headlen * Math.sin(angle + Math.PI / 7));
      c.closePath();
      c.fill();
    }

    function redibujarEscena() {
      if (!imagenActual) return;
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, lienzo.width, lienzo.height);
      ctx.drawImage(imagenActual, 0, 0);

      const mostrar = document.getElementById('cfg-mostrar').checked;
      if (!mostrar) return;

      // Dibujar flechas
      listaFlechas.forEach(f => {
        if (f.modo === 'recta' && f.puntos.length >= 2) {
          const p1 = f.puntos[0];
          const p2 = f.puntos[f.puntos.length - 1];
          dibujarFlechaRecta(ctx, p1.x, p1.y, p2.x, p2.y, f.color, f.grosor || 6);
        } else if (f.modo === 'seguir' && f.puntos.length >= 2) {
          dibujarFlechaSeguir(ctx, f.puntos, f.color, f.grosor || 6);
        }
      });

      // Dibujar puntos de notas
      listaNotas.forEach(n => {
        ctx.beginPath();
        ctx.arc(n.x, n.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#2563eb';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        if (n.texto) {
          ctx.font = 'bold 14px sans-serif';
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 3;
          ctx.strokeText(n.texto, n.x + 12, n.y + 5);
          ctx.fillText(n.texto, n.x + 12, n.y + 5);
        }
      });
    }
  </script>
</body>
</html>
